# Render Blueprint (optional). Secrets are NOT stored here — set them in the Render dashboard.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: google-drive-mcp
    runtime: node
    plan: free
    region: oregon
    branch: milestone-8
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: MCP_PUBLIC_URL
        sync: false
